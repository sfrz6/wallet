# Self-hosted deployment (e.g. a VPS behind Caddy/Nginx). Vercel does not use
# this file. Copy .env.example to .env next to this file and fill in real
# values (AUTH_SECRET, APP_URL, POSTGRES_PASSWORD) before running:
#   docker compose up -d --build
#   docker compose exec app npm run db:migrate
services:
  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://mahfazati:${POSTGRES_PASSWORD}@postgres:5432/mahfazati
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mahfazati
      POSTGRES_USER: mahfazati
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mahfazati"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
